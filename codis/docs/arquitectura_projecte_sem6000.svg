<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7efe4" />
      <stop offset="100%" stop-color="#e9f1f7" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#f8fbff" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="mainBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9eef7" />
      <stop offset="100%" stop-color="#c8e3ef" />
    </linearGradient>
    <linearGradient id="supportBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef3f8" />
      <stop offset="100%" stop-color="#e3edf4" />
    </linearGradient>
    <linearGradient id="legacyBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e5cf" />
      <stop offset="100%" stop-color="#f0d9b6" />
    </linearGradient>
    <linearGradient id="externalBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcefd8" />
      <stop offset="100%" stop-color="#cde6c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#46606f" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#355a6f"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#6c7f8b"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #173042; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #425c6c; }
      .section { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #1f4157; }
      .label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #163447; }
      .body { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #355264; }
      .mono { font: 700 15px Consolas, 'Courier New', monospace; fill: #15384f; }
      .small { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #5a7180; }
      .flow { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #284a60; }
      .panel { fill: url(#panel); stroke: #cfdae1; stroke-width: 1.5; filter: url(#shadow); }
      .main { fill: url(#mainBox); stroke: #5c8ea4; stroke-width: 1.5; }
      .support { fill: url(#supportBox); stroke: #98aebb; stroke-width: 1.2; }
      .legacy { fill: url(#legacyBox); stroke: #c69d59; stroke-width: 1.2; }
      .external { fill: url(#externalBox); stroke: #7ca56b; stroke-width: 1.2; }
      .dashed { stroke-dasharray: 8 6; }
      .line { stroke: #355a6f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #6c7f8b; stroke-width: 2.5; fill: none; marker-end: url(#arrowSoft); }
      .dot { stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1100" fill="url(#bg)" />
  <rect x="28" y="24" width="1544" height="1052" rx="28" fill="none" stroke="#d8e2e8" stroke-width="2"/>

  <text x="64" y="84" class="title">Arquitectura del projecte SEM6000 + ThingsBoard</text>
  <text x="64" y="116" class="subtitle">Una sola imatge amb la vista de fitxers principals i el flux runtime del bridge MQTT actual.</text>

  <rect x="48" y="148" width="1504" height="270" rx="26" class="panel" />
  <text x="76" y="188" class="section">1. Estructura del projecte</text>
  <text x="76" y="214" class="small">Color blau: runtime principal. Groc: cami legacy. Verd: integracions externes. Gris: suport.</text>

  <rect x="82" y="246" width="210" height="118" rx="18" class="external dashed" />
  <text x="106" y="280" class="mono">github2/python3-voltcraft-</text>
  <text x="106" y="302" class="mono">sem6000</text>
  <text x="106" y="330" class="body">Llibreria externa que parla</text>
  <text x="106" y="350" class="body">Bluetooth amb el SEM6000.</text>

  <rect x="330" y="246" width="220" height="118" rx="18" class="support" />
  <text x="354" y="280" class="mono">usa_sem6000.py</text>
  <text x="354" y="308" class="body">Wrapper local de BLE:</text>
  <text x="354" y="328" class="body">discover, connect i lectura</text>
  <text x="354" y="348" class="body">de potencia.</text>

  <rect x="588" y="228" width="224" height="136" rx="18" class="legacy" />
  <text x="612" y="262" class="mono">usa_sem6000_thingsboard.py</text>
  <text x="612" y="290" class="body">Adaptador HTTP + long polling RPC.</text>
  <text x="612" y="310" class="body">Es manté per referencia i</text>
  <text x="612" y="330" class="body">compatibilitat, no com a cami</text>
  <text x="612" y="350" class="body">principal de produccio.</text>

  <rect x="850" y="208" width="360" height="170" rx="22" class="main" />
  <text x="878" y="246" class="mono">usa_sem6000_thingsboard_mqtt.py</text>
  <text x="878" y="278" class="label">Bridge principal actual</text>
  <text x="878" y="304" class="body">Configura el gateway MQTT, processa RPC,</text>
  <text x="878" y="324" class="body">sincronitza estat i publica telemetria / atributs.</text>
  <text x="878" y="352" class="body">Conté la cua RPC, els handlers, la capa BLE</text>
  <text x="878" y="372" class="body">i els fils de worker + scheduler.</text>

  <rect x="1246" y="246" width="156" height="118" rx="18" class="support" />
  <text x="1270" y="280" class="mono">tests/</text>
  <text x="1270" y="308" class="body">Unit tests sobre</text>
  <text x="1270" y="328" class="body">parsers, cua RPC,</text>
  <text x="1270" y="348" class="body">payloads i handlers.</text>

  <rect x="1424" y="246" width="96" height="118" rx="18" class="support" />
  <text x="1448" y="280" class="mono">docs/</text>
  <text x="1448" y="308" class="body">PDFs i</text>
  <text x="1448" y="328" class="body">scripts de</text>
  <text x="1448" y="348" class="body">suport.</text>

  <path d="M 292 305 L 330 305" class="line" />
  <path d="M 550 286 L 588 286" class="line" />
  <path d="M 550 324 L 850 324" class="line" />
  <path d="M 1210 286 L 1246 286" class="soft" />
  <path d="M 1210 330 L 1424 330" class="soft dot" />
  <text x="674" y="394" class="flow">El codi actual reutilitza la capa BLE local i substitueix el cami HTTP per MQTT gateway.</text>

  <rect x="48" y="452" width="1504" height="592" rx="26" class="panel" />
  <text x="76" y="492" class="section">2. Flux runtime de `usa_sem6000_thingsboard_mqtt.py`</text>
  <text x="76" y="518" class="small">La part central mostra els objectes i fils principals. Les fletxes indiquen dependencias i direccio del flux.</text>

  <rect x="78" y="566" width="214" height="98" rx="18" class="support" />
  <text x="104" y="600" class="mono">Variables d'entorn</text>
  <text x="104" y="628" class="body">Token MQTT, host, QoS,</text>
  <text x="104" y="648" class="body">intervals, TLS i device id.</text>

  <rect x="78" y="760" width="214" height="122" rx="18" class="external" />
  <text x="104" y="794" class="mono">ThingsBoard</text>
  <text x="104" y="822" class="body">Broker MQTT + topics de</text>
  <text x="104" y="842" class="body">gateway per RPC, atributs</text>
  <text x="104" y="862" class="body">i telemetria.</text>

  <rect x="338" y="548" width="912" height="430" rx="28" class="main" />
  <text x="370" y="590" class="label">MqttSem6000Agent</text>
  <text x="370" y="616" class="small">Orquestra connexio MQTT, cues, scheduler, telemetria i control BLE.</text>

  <rect x="378" y="654" width="220" height="96" rx="18" class="support" />
  <text x="404" y="688" class="mono">AppConfig.from_env()</text>
  <text x="404" y="716" class="body">Valida configuracio i crea</text>
  <text x="404" y="736" class="body">un objecte immutable.</text>

  <rect x="628" y="654" width="260" height="96" rx="18" class="support" />
  <text x="654" y="688" class="mono">MQTT client + callbacks</text>
  <text x="654" y="716" class="body">_connect_mqtt, _on_connect,</text>
  <text x="654" y="736" class="body">_on_message, _publish_json.</text>

  <rect x="918" y="654" width="290" height="96" rx="18" class="support" />
  <text x="944" y="688" class="mono">Publishers</text>
  <text x="944" y="716" class="body">TelemetryPublisher, AttributesPublisher,</text>
  <text x="944" y="736" class="body">RpcResponder, DiagnosticsPublisher.</text>

  <rect x="378" y="804" width="220" height="96" rx="18" class="support" />
  <text x="404" y="838" class="mono">RpcTaskQueue</text>
  <text x="404" y="866" class="body">Cua thread-safe amb</text>
  <text x="404" y="886" class="body">coalescing "last wins".</text>

  <rect x="628" y="804" width="260" height="96" rx="18" class="support" />
  <text x="654" y="838" class="mono">Worker thread</text>
  <text x="654" y="866" class="body">Processa RPC i fa lectures</text>
  <text x="654" y="886" class="body">de telemetria sense concurrencia BLE.</text>

  <rect x="918" y="804" width="290" height="96" rx="18" class="support" />
  <text x="944" y="838" class="mono">Telemetry scheduler</text>
  <text x="944" y="866" class="body">Decideix quan hi ha tick de</text>
  <text x="944" y="886" class="body">telemetria i diagnostics.</text>

  <rect x="500" y="924" width="252" height="72" rx="16" class="support" />
  <text x="526" y="955" class="mono">CommandRegistry + handlers</text>
  <text x="526" y="978" class="body">PowerHandler, MeasurementHandler, futurs handlers.</text>

  <rect x="782" y="924" width="220" height="72" rx="16" class="support" />
  <text x="808" y="955" class="mono">Sem6000Session</text>
  <text x="808" y="978" class="body">Retry, reconnect i locking BLE.</text>

  <rect x="1268" y="924" width="164" height="72" rx="16" class="support" />
  <text x="1294" y="955" class="mono">usa_sem6000.py</text>
  <text x="1294" y="978" class="body">Wrapper local BLE.</text>

  <rect x="1268" y="762" width="198" height="110" rx="18" class="external dashed" />
  <text x="1294" y="796" class="mono">python3-voltcraft-</text>
  <text x="1294" y="818" class="mono">sem6000</text>
  <text x="1294" y="846" class="body">Llibreria externa usada</text>
  <text x="1294" y="866" class="body">per parlar via BLE.</text>

  <rect x="1268" y="592" width="214" height="120" rx="18" class="external" />
  <text x="1294" y="626" class="mono">Endoll fisic SEM6000</text>
  <text x="1294" y="654" class="body">Mesura consum i rep</text>
  <text x="1294" y="674" class="body">ordres on/off per Bluetooth.</text>

  <path d="M 292 615 L 378 688" class="line" />
  <text x="306" y="610" class="flow">config</text>

  <path d="M 292 820 L 628 702" class="line" />
  <text x="340" y="782" class="flow">gateway RPC / connect</text>

  <path d="M 888 702 L 918 702" class="line" />
  <path d="M 918 734 L 292 820" class="line" />
  <text x="936" y="774" class="flow">telemetria / atributs / RPC response</text>

  <path d="M 598 702 L 628 702" class="soft" />
  <path d="M 758 750 L 488 804" class="line" />
  <text x="520" y="780" class="flow">parse RPC</text>

  <path d="M 598 852 L 628 852" class="line" />
  <text x="604" y="792" class="flow">dequeue</text>

  <path d="M 1062 804 L 1062 750" class="soft" />
  <path d="M 1062 750 L 758 804" class="soft" />
  <text x="962" y="778" class="flow">telemetry_pending</text>

  <path d="M 888 852 L 918 852" class="line" />
  <text x="892" y="792" class="flow">publica</text>

  <path d="M 758 900 L 758 924" class="line" />
  <text x="766" y="917" class="flow">resolve</text>

  <path d="M 752 960 L 782 960" class="line" />
  <text x="760" y="948" class="flow">BLE op</text>

  <path d="M 1002 960 L 1268 960" class="line" />
  <text x="1090" y="948" class="flow">reuse wrapper</text>

  <path d="M 1350 924 L 1364 872" class="line" />
  <text x="1378" y="904" class="flow">imports</text>

  <path d="M 1366 762 L 1366 712" class="line" />
  <text x="1380" y="736" class="flow">BLE</text>

  <path d="M 1048 804 L 1048 750" class="soft" />
  <path d="M 1048 750 L 1048 654" class="soft" />
  <text x="1060" y="792" class="flow">diagnostics</text>

  <text x="380" y="1018" class="small">Separacio important: el scheduler nomes decideix quan toca publicar; el worker executa RPC i lectures reals.</text>

  <circle cx="102" cy="1020" r="8" fill="#76a2b6" />
  <text x="120" y="1025" class="small">runtime actual</text>
  <circle cx="256" cy="1020" r="8" fill="#e0b66d" />
  <text x="274" y="1025" class="small">legacy / referencia</text>
  <circle cx="452" cy="1020" r="8" fill="#9cc691" />
  <text x="470" y="1025" class="small">extern / hardware</text>
  <circle cx="630" cy="1020" r="8" fill="#c9d6df" />
  <text x="648" y="1025" class="small">suport i infraestructura</text>
</svg>
